<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Varshini Packers & Movers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg,#0d6efd,#1877F2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:#fff;
    width:90%;
    max-width:600px;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.success-icon{
    width:100px;
    height:100px;
    background:#28a745;
    color:#fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin:0 auto 20px;
}

h1{
    color:#0d6efd;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.6;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:#0d6efd;
    color:white;
    padding:12px 30px;
    border-radius:50px;
    font-size:18px;
    transition:0.3s;
}

.btn:hover{
    background:#084298;
}

.company{
    margin-top:25px;
    color:#666;
    font-size:15px;
}

@media(max-width:768px){
    .container{
        padding:25px;
    }

    h1{
        font-size:28px;
    }

    p{
        font-size:16px;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="success-icon">✓</div>

    <h1>Thank You!</h1>

    <p>
        Your request has been submitted successfully.
        Our team will contact you shortly regarding your relocation service.
    </p>

    <a href="index.html" class="btn">Back to Home</a>

    <div class="company">
        <strong>Varshini Packers & Movers</strong><br>
        Chennai, Tamil Nadu<br>
        📞 8939180119
    </div>

</div>

</body>
</html>
